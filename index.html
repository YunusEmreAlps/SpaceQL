<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpaceQL — Interactive SQL Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #0d1b2a;
      }

      /* Make the Monaco editor fill its container */
      #editor {
        width: 100%;
        height: 100%;
      }

      /* Canvas fills the scene pane */
      #scene-pane canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }

      /* Mobile responsive adjustments */
      @media (max-width: 767px) {
        #camera-hint {
          font-size: 10px;
        }
        
        .editor-panel {
          height: 350px !important;
          width: 100% !important;
          min-width: unset !important;
        }
        
        #canvas-container {
          height: 300px !important;
        }
        
        .terminal-panel {
          height: calc(100% - 300px) !important;
        }
        
        /* Touch-friendly buttons on mobile */
        button {
          min-height: 40px;
          min-width: 40px;
          touch-action: manipulation;
        }
        
        /* Examples button more prominent */
        #examples-btn {
          font-weight: 600;
        }
        
        /* Run button more prominent */
        #btn-run {
          font-weight: 700;
          font-size: 0.875rem;
        }
      }
      
      /* Desktop layout */
      @media (min-width: 768px) {
        .editor-panel {
          width: 42% !important;
          min-width: 320px !important;
          height: 100% !important;
        }
        
        #canvas-container {
          height: 60% !important;
        }
        
        .terminal-panel {
          height: 40% !important;
        }
      }

      /* Scrollbar styling */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0d1b2a;
      }
      ::-webkit-scrollbar-thumb {
        background: #1a3a5c;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00add8;
      }

      /* Terminal output scrollbar */
      #terminal-output::-webkit-scrollbar {
        width: 8px;
      }
      #terminal-output::-webkit-scrollbar-track {
        background: #0d1b2a;
      }
      #terminal-output::-webkit-scrollbar-thumb {
        background: #1a3a5c;
        border-radius: 4px;
      }
      #terminal-output::-webkit-scrollbar-thumb:hover {
        background: #00add8;
      }

      /* Dropdown menu */
      #examples-menu {
        display: none;
        position: absolute;
        bottom: 100%;
        left: 0;
        min-width: 220px;
        margin-bottom: 4px;
        max-height: 400px;
        overflow-y: auto;
      }
      #examples-menu.open {
        display: block;
      }
      
      @media (max-width: 767px) {
        #examples-menu {
          min-width: 200px;
          max-height: 300px;
        }
        
        #examples-menu button {
          padding: 12px 16px;
          font-size: 0.875rem;
          min-height: 44px;
        }
      }

      .speed-btn.active {
        background: #00add8;
        color: #0d1b2a;
      }

      /* SQL Helper Modal */
      #sql-helper-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(4px);
        z-index: 1000;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      
      #sql-helper-modal.open {
        display: flex;
      }
      
      .helper-content {
        background: #0F2337;
        border: 2px solid #1A3A5C;
        border-radius: 12px;
        max-width: 900px;
        width: 100%;
        max-height: 90vh;
        display: flex;
        flex-direction: column;
        box-shadow: 0 0 30px rgba(0, 173, 216, 0.3);
      }
      
      .helper-body {
        display: flex;
        flex: 1;
        overflow: hidden;
        min-height: 0;
      }
      
      .helper-sidebar {
        border-right: 1px solid #1A3A5C;
        background: #0D1B2A;
        width: 220px;
        overflow-y: auto;
        flex-shrink: 0;
      }
      
      .helper-category-btn {
        width: 100%;
        text-align: left;
        padding: 12px 16px;
        border: none;
        background: transparent;
        color: #7EC8E3;
        cursor: pointer;
        transition: all 0.2s;
        border-left: 3px solid transparent;
        font-size: 0.875rem;
        display: block;
      }
      
      .helper-category-btn:hover {
        background: #1A3A5C;
        color: #00ADD8;
      }
      
      .helper-category-btn.active {
        background: #1A3A5C;
        color: #00ADD8;
        border-left-color: #00ADD8;
        font-weight: 600;
      }
      
      .helper-detail {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
      }
      
      .helper-code {
        background: #0D1B2A;
        border: 1px solid #1A3A5C;
        border-radius: 6px;
        padding: 12px;
        font-family: 'Courier New', monospace;
        font-size: 0.875rem;
        color: #7EC8E3;
        white-space: pre-wrap;
        overflow-x: auto;
        line-height: 1.5;
      }
      
      .helper-example {
        background: #0D1B2A;
        border: 1px solid #1A3A5C;
        border-radius: 6px;
        padding: 12px;
        margin-bottom: 12px;
        cursor: pointer;
        transition: all 0.2s;
      }
      
      .helper-example:hover {
        border-color: #00ADD8;
        box-shadow: 0 0 10px rgba(0, 173, 216, 0.2);
      }
      
      .helper-example:active {
        transform: scale(0.98);
      }
      
      @media (max-width: 767px) {
        #sql-helper-modal {
          padding: 0;
          align-items: stretch;
        }
        
        .helper-content {
          max-height: 100vh;
          height: 100vh;
          max-width: 100%;
          border-radius: 0;
          border: none;
        }
        
        .helper-body {
          flex-direction: column;
        }
        
        .helper-sidebar {
          border-right: none;
          border-bottom: 1px solid #1A3A5C;
          overflow-x: auto;
          overflow-y: hidden;
          white-space: nowrap;
          width: 100%;
          flex-shrink: 0;
          display: flex;
          -webkit-overflow-scrolling: touch;
          scroll-snap-type: x mandatory;
        }
        
        .helper-sidebar::-webkit-scrollbar {
          height: 4px;
        }
        
        .helper-category-btn {
          display: inline-flex;
          align-items: center;
          width: auto;
          min-width: fit-content;
          padding: 12px 16px;
          border-left: none;
          border-bottom: 3px solid transparent;
          white-space: nowrap;
          font-size: 0.8rem;
          scroll-snap-align: start;
          touch-action: manipulation;
        }
        
        .helper-category-btn.active {
          border-left: none;
          border-bottom-color: #00ADD8;
        }
        
        .helper-detail {
          padding: 12px;
          -webkit-overflow-scrolling: touch;
        }
        
        .helper-code {
          font-size: 0.75rem;
          padding: 8px;
        }
        
        .helper-example {
          padding: 10px;
          margin-bottom: 10px;
        }
        
        /* Make examples more touch-friendly */
        .helper-example {
          min-height: 60px;
          touch-action: manipulation;
        }
      }
      
      /* Very small screens */
      @media (max-width: 400px) {
        .helper-category-btn {
          padding: 10px 12px;
          font-size: 0.75rem;
        }
        
        .helper-detail {
          padding: 10px;
        }
        
        .helper-code {
          font-size: 0.7rem;
          padding: 6px;
        }
        
        .helper-example {
          padding: 8px;
        }
      }
    </style>

    <!-- Import map: Three.js ES modules -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
        }
      }
    </script>

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <!-- sql.js for real SQL execution -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.min.js"></script>

    <!-- Monaco loader -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
  </head>

  <body
    class="bg-[#0D1B2A] text-white select-none"
    style="height: 100vh; display: flex; flex-direction: column"
  >
    <!-- ── TOP BAR ──────────────────────────────────────────────────────── -->
    <header
      class="flex items-center justify-between px-3 md:px-4 py-2 md:py-2 border-b border-[#1A3A5C] shrink-0"
    >
      <div class="flex items-center gap-2 md:gap-3">
        <a
          href="index.html"
          class="text-[#00ADD8] hover:text-white transition-colors text-lg md:text-xl font-bold"
        >
          SpaceQL</a
        >
        <span class="text-[#1A3A5C] hidden sm:inline">|</span>
        <span class="text-[#7EC8E3] text-xs md:text-sm font-mono hidden sm:inline">Visual SQL Editor</span>
      </div>
      <div class="flex items-center gap-2 md:gap-3 text-xs md:text-xs font-mono">
        <button
          id="btn-sql-helper"
          class="flex items-center gap-1 px-3 py-2 md:py-1.5 rounded text-sm md:text-xs font-mono border border-[#1A3A5C] hover:border-[#00ADD8] hover:text-[#00ADD8] transition-colors"
          title="SQL Syntax Helper"
        >
          <span>?</span>
          <span class="hidden md:inline">Help</span>
        </button>
        <span class="text-[#4A6A8A]" id="parse-status">Ready</span>
      </div>
    </header>

    <!-- ── MAIN LAYOUT: editor | scene ──────────────────────────────────── -->
    <main class="flex flex-col md:flex-row flex-1 overflow-hidden">
      <!-- LEFT: Code editor panel -->
      <div
        class="editor-panel flex flex-col border-b md:border-b-0 md:border-r border-[#1A3A5C]"
        style="width: 100%; height: 350px"
      >
        <!-- Editor area -->
        <div id="editor" class="flex-1"></div>

        <!-- Editor bottom toolbar -->
        <div
          class="flex items-center gap-2 px-3 py-2 border-t border-[#1A3A5C] bg-[#0F2337] shrink-0 flex-wrap"
        >
          <div class="relative">
            <button
              id="examples-btn"
              class="flex items-center gap-1 px-3 py-2 md:py-1.5 rounded text-sm md:text-xs font-mono border border-[#1A3A5C] hover:border-[#00ADD8] hover:text-[#00ADD8] transition-colors whitespace-nowrap"
            >
              Examples ▾
            </button>
            <div
              id="examples-menu"
              class="bg-[#0F2337] border border-[#1A3A5C] rounded-lg shadow-xl z-50 overflow-hidden"
            >
              <!-- Populated by JS -->
            </div>
          </div>
          <button
            id="btn-run"
            class="px-4 py-2 md:py-1.5 rounded text-sm md:text-xs font-mono bg-[#00ADD8] text-[#0D1B2A] font-bold hover:bg-[#00D4FF] transition-colors ml-auto whitespace-nowrap"
          >
            ▶ Run
          </button>
          <button
            id="btn-clear"
            class="px-3 py-2 md:py-1.5 rounded text-sm md:text-xs font-mono border border-[#1A3A5C] hover:border-[#EF5350] hover:text-[#EF5350] transition-colors whitespace-nowrap"
          >
            Clear
          </button>
        </div>
      </div>

      <!-- RIGHT: 3D scene panel -->
      <div id="scene-pane" class="flex flex-col flex-1 overflow-hidden">
        <!-- Scene canvas container -->
        <div
          id="canvas-container"
          class="relative overflow-hidden"
          style="height: 300px"
        >
          <!-- Canvas injected here by JS -->

          <!-- Camera hint overlay -->
          <div
            id="camera-hint"
            class="absolute bottom-2 md:bottom-4 right-2 md:right-4 text-xs text-[#4A6A8A] font-mono pointer-events-none"
          >
            <span class="hidden md:inline">Drag → rotate &nbsp;·&nbsp; Scroll → zoom &nbsp;·&nbsp; Right drag →
            pan</span>
            <span class="md:hidden">Drag to rotate</span>
          </div>
        </div>

        <!-- Terminal output panel -->
        <div
          class="terminal-panel flex flex-col border-t border-[#1A3A5C] bg-[#0D1B2A]"
          style="height: calc(100% - 300px)"
        >
          <div
            class="flex items-center justify-between px-2 md:px-3 py-1.5 border-b border-[#1A3A5C] bg-[#0F2337]"
          >
            <span class="text-[#7EC8E3] text-xs md:text-xs font-mono font-bold"
              >Terminal Output</span
            >
            <button
              id="btn-clear-terminal"
              class="px-2 py-1 md:py-0.5 rounded text-xs font-mono text-[#4A6A8A] hover:text-[#EF5350] transition-colors"
            >
              Clear
            </button>
          </div>
          <div
            id="terminal-output"
            class="flex-1 overflow-y-auto px-2 md:px-3 py-2 font-mono text-xs md:text-sm text-[#E8F4FD]"
          >
            <div class="text-[#4A6A8A] text-xs">
              Ready. Run your code to see output...
            </div>
          </div>
        </div>

        <!-- Scene bottom toolbar -->
        <div
          class="flex items-center gap-2 px-2 md:px-3 py-2 border-t border-[#1A3A5C] bg-[#0F2337] shrink-0 flex-wrap"
        >
          <button
            id="btn-pause"
            class="px-2 md:px-3 py-2 md:py-1.5 rounded text-sm md:text-xs font-mono border border-[#1A3A5C] hover:border-[#00ADD8] hover:text-[#00ADD8] transition-colors whitespace-nowrap"
          >
            ⏸ Pause
          </button>
          <button
            id="btn-reset"
            class="px-2 md:px-3 py-2 md:py-1.5 rounded text-sm md:text-xs font-mono border border-[#1A3A5C] hover:border-[#00ADD8] hover:text-[#00ADD8] transition-colors whitespace-nowrap"
          >
            ↩ Reset
          </button>
          
          <button
            id="btn-view-mode"
            class="px-2 md:px-3 py-2 md:py-1.5 rounded text-sm md:text-xs font-mono border border-[#1A3A5C] hover:border-[#00ADD8] hover:text-[#00ADD8] transition-colors whitespace-nowrap"
            title="Toggle 2D/3D view for JOIN visualization"
          >
            2D View
          </button>

          <span class="text-[#1A3A5C] mx-1 hidden sm:inline">|</span>
          <span class="text-xs text-[#4A6A8A] font-mono hidden sm:inline">Speed:</span>
          <button
            data-speed="0.5"
            class="speed-btn px-2 py-1.5 md:py-1 rounded text-sm md:text-xs font-mono border border-[#1A3A5C] hover:border-[#00ADD8] transition-colors whitespace-nowrap"
          >
            0.5×
          </button>
          <button
            data-speed="1"
            class="speed-btn active px-2 py-1.5 md:py-1 rounded text-sm md:text-xs font-mono border border-[#1A3A5C] hover:border-[#00ADD8] transition-colors whitespace-nowrap"
          >
            1×
          </button>
          <button
            data-speed="2"
            class="speed-btn px-2 py-1.5 md:py-1 rounded text-sm md:text-xs font-mono border border-[#1A3A5C] hover:border-[#00ADD8] transition-colors whitespace-nowrap"
          >
            2×
          </button>
        </div>
      </div>
    </main>

    <!-- ── SQL HELPER MODAL ─────────────────────────────────────────────── -->
    <div id="sql-helper-modal">
      <div class="helper-content">
        <!-- Header -->
        <div class="flex items-center justify-between px-3 md:px-4 py-2 md:py-3 border-b border-[#1A3A5C] shrink-0">
          <h2 class="text-base md:text-lg font-bold text-[#00ADD8]">SQL Syntax Helper</h2>
          <button
            id="close-helper"
            class="px-2 md:px-3 py-1 rounded text-[#7EC8E3] hover:text-[#EF5350] transition-colors text-xl leading-none"
            title="Close (ESC)"
          >
            ✕
          </button>
        </div>
        
        <!-- Body -->
        <div class="helper-body">
          <!-- Sidebar Categories -->
          <div class="helper-sidebar">
            <div id="helper-categories"></div>
          </div>
          
          <!-- Detail Panel -->
          <div class="helper-detail">
            <div id="helper-detail-content">
              <p class="text-[#7EC8E3] text-center py-8">Select a command to view details</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ── APP SCRIPT ────────────────────────────────────────────────────── -->
    <script type="module">
      import * as THREE from "three";
      import {
        scene,
        camera,
        renderer,
        labelRenderer,
        composer,
        controls,
        getCanvas,
        getLabelRenderer,
        setCameraMode,
      } from "./js/core/scene.js";
      import { parseSQL } from "./js/engine/parser.js";
      import OpenWorldEngine from "./js/engine/engine.js";
      import { debounce } from "./js/core/utils.js";
      import { EXAMPLES } from "./js/data/examples.js";
      import { SQL_SCHEMA } from "./js/data/tables.js";
      import { getSuggestions } from "./js/data/suggestions.js";
      import { SQL_HELP, HELP_CATEGORIES } from "./js/data/sqlhelp.js";

      // ── Scene setup ─────────────────────────────────────────────────────
      const container = document.getElementById("canvas-container");
      const canvas = getCanvas();
      const labelRendererElement = getLabelRenderer();
      
      // Mount WebGL canvas
      container.insertBefore(canvas, container.firstChild);
      canvas.style.position = "absolute";
      canvas.style.inset = "0";
      
      // Mount CSS2D label renderer
      container.insertBefore(labelRendererElement, container.firstChild);
      labelRendererElement.style.position = "absolute";
      labelRendererElement.style.inset = "0";
      labelRendererElement.style.pointerEvents = "none";

      // Resize renderer to scene pane (not full window)
      function resizeToPane() {
        const w = container.clientWidth;
        const h = container.clientHeight;
        renderer.setSize(w, h);
        labelRenderer.setSize(w, h);
        composer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      resizeToPane();
      window.addEventListener("resize", resizeToPane);

      // ── Engine ───────────────────────────────────────────────────────────
      const engine = new OpenWorldEngine(scene, camera);

      // ── Animation loop ───────────────────────────────────────────────────
      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        controls.update();
        engine.tick(delta);
        composer.render();  // Use composer for bloom effect
        labelRenderer.render(scene, camera);  // Render CSS2D labels
      }
      animate();

      // Populate examples dropdown
      const menu = document.getElementById("examples-menu");
      EXAMPLES.forEach((ex) => {
        const btn = document.createElement("button");
        btn.className =
          "w-full text-left px-4 py-2 text-sm font-mono text-[#7EC8E3] hover:bg-[#1A3A5C] hover:text-white transition-colors";
        btn.textContent = ex.label;
        btn.addEventListener("click", () => {
          editor.setValue(ex.code);
          menu.classList.remove("open");
        });
        menu.appendChild(btn);
      });

      // Toggle examples dropdown
      const examplesBtn = document.getElementById("examples-btn");
      examplesBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        menu.classList.toggle("open");
      });
      document.addEventListener("click", () => menu.classList.remove("open"));

      // ── SQL Helper Modal ─────────────────────────────────────────────────
      const helperModal = document.getElementById("sql-helper-modal");
      const helperCategories = document.getElementById("helper-categories");
      const helperDetailContent = document.getElementById("helper-detail-content");
      
      // Populate categories
      HELP_CATEGORIES.forEach((category, index) => {
        const btn = document.createElement("button");
        btn.className = `helper-category-btn ${index === 0 ? 'active' : ''}`;
        // Use short label on mobile, full label on desktop
        const isMobile = window.innerWidth < 768;
        const labelText = category.label;
        btn.innerHTML = `<span class="mr-1">${category.icon}</span><span>${labelText}</span>`;
        btn.dataset.category = category.id;
        btn.addEventListener("click", () => {
          // Update active state
          document.querySelectorAll(".helper-category-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          // Show category details
          showHelpCategory(category.id);
          // Reset detail scroll position
          const detailPanel = document.querySelector('.helper-detail');
          if (detailPanel) detailPanel.scrollTop = 0;
          // Scroll active button into view on mobile
          if (window.innerWidth < 768) {
            btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
          }
        });
        helperCategories.appendChild(btn);
      });
      
      // Show category details
      function showHelpCategory(categoryId) {
        const helpData = SQL_HELP[categoryId];
        if (!helpData) return;
        
        let html = `
          <div class="mb-3 md:mb-4">
            <h3 class="text-lg md:text-xl font-bold text-[#00ADD8] mb-2">${helpData.title}</h3>
          </div>
          
          <div class="mb-4 md:mb-6">
            <h4 class="text-xs md:text-sm font-bold text-[#7EC8E3] mb-2 uppercase">Syntax:</h4>
            <div class="helper-code">${helpData.syntax}</div>
          </div>
        `;
        
        if (helpData.examples && helpData.examples.length > 0) {
          html += `
            <div class="mb-4 md:mb-6">
              <h4 class="text-xs md:text-sm font-bold text-[#7EC8E3] mb-2 md:mb-3 uppercase">Examples:</h4>
          `;
          
          helpData.examples.forEach(example => {
            html += `
              <div class="helper-example" onclick="applyHelperExample(\`${example.code.replace(/`/g, '\\`')}\`)">
                <div class="flex items-start justify-between mb-2 gap-2">
                  <span class="text-[#00ADD8] font-bold text-xs md:text-sm">${example.label}</span>
                  <span class="text-[#4A6A8A] text-xs whitespace-nowrap flex-shrink-0">Tap to use →</span>
                </div>
                <div class="helper-code mb-2">${example.code}</div>
                <p class="text-[#7EC8E3] text-xs leading-relaxed">${example.description}</p>
              </div>
            `;
          });
          
          html += `</div>`;
        }
        
        if (helpData.tips && helpData.tips.length > 0) {
          html += `
            <div class="mb-4">
              <h4 class="text-xs md:text-sm font-bold text-[#7EC8E3] mb-2 uppercase">Tips:</h4>
              <ul class="space-y-2">
          `;
          
          helpData.tips.forEach(tip => {
            html += `<li class="text-[#7EC8E3] text-xs md:text-sm pl-3 md:pl-4 border-l-2 border-[#1A3A5C] leading-relaxed"> ${tip}</li>`;
          });
          
          html += `
              </ul>
            </div>
          `;
        }
        
        helperDetailContent.innerHTML = html;
      }
      
      // Apply example code to editor
      window.applyHelperExample = function(code) {
        if (window.editor) {
          editor.setValue(code);
          helperModal.classList.remove("open");
        }
      };
      
      // Open/close modal
      document.getElementById("btn-sql-helper").addEventListener("click", () => {
        helperModal.classList.add("open");
        // Show first category by default
        if (HELP_CATEGORIES.length > 0) {
          showHelpCategory(HELP_CATEGORIES[0].id);
        }
        // Reset scroll positions
        const detailPanel = document.querySelector('.helper-detail');
        if (detailPanel) detailPanel.scrollTop = 0;
        
        const sidebar = document.querySelector('.helper-sidebar');
        if (sidebar) sidebar.scrollLeft = 0;
        
        // Prevent body scroll on mobile
        document.body.style.overflow = 'hidden';
      });
      
      document.getElementById("close-helper").addEventListener("click", () => {
        helperModal.classList.remove("open");
        // Restore body scroll
        document.body.style.overflow = '';
      });
      
      // Close on backdrop click
      helperModal.addEventListener("click", (e) => {
        if (e.target === helperModal) {
          helperModal.classList.remove("open");
          document.body.style.overflow = '';
        }
      });
      
      // Close on ESC key
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && helperModal.classList.contains("open")) {
          helperModal.classList.remove("open");
          document.body.style.overflow = '';
        }
      });

      // ── Playback controls ────────────────────────────────────────────────
      let isPaused = false;
      const btnPause = document.getElementById("btn-pause");
      btnPause.addEventListener("click", () => {
        isPaused = !isPaused;
        if (isPaused) {
          engine.pause();
          btnPause.textContent = "▶ Resume";
          btnPause.classList.add("border-[#00ADD8]", "text-[#00ADD8]");
        } else {
          engine.resume();
          btnPause.textContent = "⏸ Pause";
          btnPause.classList.remove("border-[#00ADD8]", "text-[#00ADD8]");
        }
      });

      document.getElementById("btn-reset").addEventListener("click", () => {
        engine.reset();
        if (window.editor) engine.update(parseSQL(editor.getValue()));
      });

      // View mode toggle (2D/3D)
      let currentViewMode = '3d';
      const btnViewMode = document.getElementById("btn-view-mode");
      btnViewMode.addEventListener("click", () => {
        currentViewMode = currentViewMode === '3d' ? '2d' : '3d';
        btnViewMode.textContent = currentViewMode === '3d' ? '2D View' : '3D View';
        
        // Update camera mode
        setCameraMode(currentViewMode);
        
        // Update visualizer view mode
        if (engine.visualizers && engine.visualizers.select) {
          engine.visualizers.select.setViewMode(currentViewMode);
        }
      });

      document.querySelectorAll(".speed-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".speed-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          engine.setSpeed(parseFloat(btn.dataset.speed));
        });
      });

      document.getElementById("btn-clear").addEventListener("click", () => {
        if (window.editor)
          editor.setValue("");
      });

      // ── Terminal Output ──────────────────────────────────────────────────
      const terminalOutput = document.getElementById("terminal-output");

      function clearTerminal() {
        terminalOutput.innerHTML =
          '<div class="text-[#4A6A8A] text-xs">Ready. Run your code to see output...</div>';
      }

      function printToTerminal(text, color = "#E8F4FD") {
        const line = document.createElement("div");
        line.className = "py-0.5";
        line.style.color = color;
        line.textContent = text;
        terminalOutput.appendChild(line);
        terminalOutput.scrollTop = terminalOutput.scrollHeight;
      }

      document
        .getElementById("btn-clear-terminal")
        .addEventListener("click", clearTerminal);

      // ── Run button (manual execution with real SQL) ──────────────────────
      document.getElementById("btn-run").addEventListener("click", async () => {
        if (!window.editor || !db) return;

        const code = editor.getValue().trim();
        const statusEl = document.getElementById("parse-status");

        try {
          engine.reset();
          clearTerminal();

          // Execute real SQL query
          printToTerminal(`> ${code}`, "#7EC8E3");
          printToTerminal('', '#E8F4FD'); // Empty line

          const results = db.exec(code);

          if (results.length > 0) {
            // Display results in terminal
            results.forEach((result, idx) => {
              const { columns, values } = result;
              
              printToTerminal(`Query ${idx + 1} Results:`, "#00ADD8");
              printToTerminal(`─────────────────────────────────────`, "#1A3A5C");
              
              // Header
              printToTerminal(columns.join(' | '), "#69FF47");
              printToTerminal('─'.repeat(columns.join(' | ').length), "#1A3A5C");
              
              // Rows
              if (values.length === 0) {
                printToTerminal('(no rows)', "#4A6A8A");
              } else {
                values.forEach(row => {
                  printToTerminal(row.join(' | '), "#E8F4FD");
                });
                printToTerminal('', '#E8F4FD');
                printToTerminal(`${values.length} row(s) returned`, "#00ADD8");
              }
            });

            // Parse for visualization
            const parsed = parseSQL(code);
            
            // Enhance parsed data with real results
            if (parsed.type === 'SELECT' && parsed.selects.length > 0 && results[0]) {
              parsed.selects[0].resultColumns = results[0].columns;
              parsed.selects[0].resultRows = results[0].values;
            }
            
            engine.update(parsed);
          } else {
            // Non-SELECT queries (INSERT, UPDATE, DELETE, CREATE, etc.)
            const upperCode = code.toUpperCase();
            if (upperCode.startsWith('INSERT')) {
              printToTerminal('✓ Row inserted successfully', "#69FF47");
            } else if (upperCode.startsWith('UPDATE')) {
              printToTerminal('✓ Row(s) updated successfully', "#69FF47");
            } else if (upperCode.startsWith('DELETE')) {
              printToTerminal('✓ Row(s) deleted successfully', "#69FF47");
            } else if (upperCode.startsWith('CREATE')) {
              printToTerminal('✓ Table created successfully', "#69FF47");
            } else {
              printToTerminal('✓ Query executed successfully', "#69FF47");
            }

            // Still parse and visualize
            const parsed = parseSQL(code);
            engine.update(parsed);
          }

          statusEl.textContent = "✅ Query executed";
          statusEl.className = "text-[#69FF47]";

          setTimeout(() => {
            statusEl.textContent = "Ready";
            statusEl.className = "text-[#4A6A8A]";
          }, 2000);
        } catch (error) {
          statusEl.textContent = `❌ SQL Error`;
          statusEl.className = "text-[#EF5350]";
          printToTerminal(`Error: ${error.message}`, "#EF5350");
          console.error("SQL error:", error);
        }
      });

      // ── SQL.js Database Setup ────────────────────────────────────────────
      let db = null;
      let SQL = null;

      async function initDatabase() {
        try {
          SQL = await initSqlJs({
            locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
          });
          db = new SQL.Database();

          // Create sample tables with data
          db.run(SQL_SCHEMA);

          printToTerminal('✓ Database initialized with sample data', '#69FF47');
          printToTerminal('Tables: users, orders', '#7EC8E3');
          return true;
        } catch (err) {
          console.error('Database initialization error:', err);
          printToTerminal(`Database error: ${err.message}`, '#EF5350');
          return false;
        }
      }

      // ── Monaco Editor ────────────────────────────────────────────────────
      require.config({
        paths: {
          vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs",
        },
      });

      require(["vs/editor/editor.main"], function () {
        // Monaco API is available only after editor.main is loaded.
        monaco.editor.defineTheme("gopher-space", {
          base: "vs-dark",
          inherit: true,
          rules: [
            { token: "keyword", foreground: "569CD6" },
            { token: "identifier", foreground: "9CDCFE" },
            { token: "number", foreground: "B5CEA8" },
            { token: "string", foreground: "CE9178" },
            { token: "comment", foreground: "6A9955", fontStyle: "italic" },
            { token: "operator", foreground: "D4D4D4" },
          ],
          colors: {
            "editor.background": "#0D1B2A",
            "editor.foreground": "#E8F4FD",
            "editorCursor.foreground": "#E8F4FD",
            "editor.lineHighlightBackground": "#1A3A5C",
            "editorLineNumber.foreground": "#4A6A8A",
            "editor.selectionBackground": "#264F78",
            "editor.inactiveSelectionBackground": "#264F78AA",
          },
        });

        window.editor = monaco.editor.create(
          document.getElementById("editor"),
          {
            value: EXAMPLES[0].code,
            language: "sql",
            theme: "gopher-space",
            minimap: { enabled: false },
            fontSize: 14,
            lineNumbers: "on",
            scrollBeyondLastLine: false,
            automaticLayout: true,
            padding: { top: 12, bottom: 12 },
            fontFamily:
              '"Cascadia Code", "Fira Code", "JetBrains Mono", Consolas, monospace',
            renderLineHighlight: "gutter",
            bracketPairColorization: { enabled: true },
            suggestOnTriggerCharacters: true,
            quickSuggestions: {
              other: true,
              comments: false,
              strings: false,
            },
            parameterHints: { enabled: true },
            wordBasedSuggestions: true,
            autoClosingBrackets: "always",
            autoClosingQuotes: "always",
            formatOnType: true,
            formatOnPaste: true,
          },
        );

        // ── SQL Language Autocomplete ────────────────────────────────────────
        const suggestions = getSuggestions(monaco);
        monaco.languages.registerCompletionItemProvider("sql", {
          provideCompletionItems: (model, position) => {
            return { suggestions: suggestions };
          },
        });

        const status = document.getElementById("parse-status");

        const onCodeChange = debounce(() => {
          const code = editor.getValue();
          try {
            const parsed = parseSQL(code);
            engine.update(parsed);

            // Show what was detected
            status.textContent = `${parsed.type} Query`;
            status.style.color = "#00ADD8";
          } catch (e) {
            status.textContent = "Parse error";
            status.style.color = "#EF5350";
            console.error("Parse error:", e);
          }
        }, 300);

        editor.onDidChangeModelContent(onCodeChange);

        // Initial parse
        onCodeChange();

        // Initialize database after editor is ready
        initDatabase();
      });
    </script>
  </body>
</html>
